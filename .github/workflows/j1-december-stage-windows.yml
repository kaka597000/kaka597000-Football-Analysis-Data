name: Verify December J1 first-display registration

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-j1-december-windows/**'
      - '.github/workflows/j1-december-stage-windows.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WINDOW: workspace-updates/20261126-j1-december-windows
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261125-j1-stage-windows
            workspace-updates/20261126-r26-j1-first-stage
            workspace-updates/20261126-j1-december-windows
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 73430408cbc7649130608beb36d4d8c6d2419a67
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Replay the schedule and prospective registration
        run: |
          (cd "$WINDOW" && sha256sum -c SHA256SUMS)
          python -B "$WINDOW/verify.py" > "$RUNNER_TEMP/j1-december-review.json"
