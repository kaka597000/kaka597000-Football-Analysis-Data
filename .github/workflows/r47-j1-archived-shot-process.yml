name: Reproduce R47 J1 archived shot replay

on:
  pull_request:
    paths:
      - 'workspace-updates/20261127-r47-j1-archived-shot-process/**'
      - '.github/workflows/r47-j1-archived-shot-process.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261127-r47-j1-archived-shot-process
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi/models
            workspace-updates/20261123-prematch-literature/models
            workspace-updates/20261127-r46-j1-process-at-fixed-total/history
            workspace-updates/20261127-r47-j1-archived-shot-process
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 968fe42592a6b9ce4019c00e04c97b8dccb3323d
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Reproduce the two date slices against the signed R7 score grids
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261127-r47-j1-archived-shot-process/protocol.json
          python -B -m research_program.j1_archived_shot_process --data . --replay "$RUNNER_TEMP/r47-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r47-replay"
