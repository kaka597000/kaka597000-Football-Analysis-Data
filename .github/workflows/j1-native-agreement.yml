name: Replay archived J1 agreement decisions

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-j1-native-agreement/**'
      - '.github/workflows/j1-native-agreement.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-j1-native-agreement
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261125-j1-stage-windows
            workspace-updates/20261126-j1-forward-result-review
            workspace-updates/20261126-j1-native-agreement
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 71ba85c405c825d3fff10894de6b7dcf2eb3e5e3
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Replay the eighteen original fixtures
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          python -B "$PACKAGE/study.py" > "$RUNNER_TEMP/j1-agreement-results.json"
          cmp "$PACKAGE/results.json" "$RUNNER_TEMP/j1-agreement-results.json"
