name: Reproduce the historical first-score comparison

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-first-score-comparison/**'
      - '.github/workflows/first-score-comparison.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-first-score-comparison
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261126-first-score-comparison
            workspace-updates/20261126-r25-j1-allocation
            workspace-updates/20261126-r26-j1-first-stage
            workspace-updates/20261126-r27-j1-score-calibration
            workspace-updates/20261126-r29-j1-score-dispersion
            workspace-updates/20261126-r30-europe-score-dispersion
            workspace-updates/20261126-r31-uel-outcome-calibration
            workspace-updates/20261126-r32-europe-one-all
            workspace-updates/20261126-r33-europe-shot-score
            workspace-updates/20261126-r34-europe-winning-margin
            workspace-updates/20261126-r35-europe-close-score-agreement
            workspace-updates/20261126-r36-europe-three-goal-coverage
            workspace-updates/20261126-r37-europe-exactly-three
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 12de69b106ab8496ef10bc2211ebe03cabcbc9cb
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt
      - name: Compare both historical score metrics and verify every archived fixture
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          python -B "$PACKAGE/compare_scores.py" > "$RUNNER_TEMP/first-score-comparison.json"
          cmp "$PACKAGE/comparison.json" "$RUNNER_TEMP/first-score-comparison.json"
