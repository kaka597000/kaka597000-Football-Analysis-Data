name: Reproduce R30 Europa and Conference score calibration

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r30-europe-score-dispersion/**'
      - '.github/workflows/r30-europe-score-dispersion.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-r30-europe-score-dispersion
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-r13-domestic-form
            workspace-updates/20261126-r30-europe-score-dispersion
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: ea5bda9f7035ead7a2e9e5298ed4cf6961dc8489
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Fit the locked windows and verify the fixture-level outputs
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261126-r30-europe-score-dispersion/protocol.json
          python -B -m research_program.europe_score_dispersion --data . --out "$RUNNER_TEMP/r30-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r30-replay"
