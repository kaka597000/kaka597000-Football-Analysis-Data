name: Verify the two EPL first-display window registrations
on:
  pull_request:
    paths:
      - 'workspace-updates/20261125-epl-stage-windows/**'
      - '.github/workflows/epl-first-windows.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EPL_PACKAGE: workspace-updates/20261125-epl-stage-windows
      PYTHONPATH: source/runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 96e9a8e5b1138572ddcad5b3ebfd890cbfaa9a0c
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0
      - run: |
          python -B "$EPL_PACKAGE/verify.py"
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path("source")
          saved = json.loads((Path(os.environ["EPL_PACKAGE"]) / "goals.json").read_bytes())
          goals = source / "project-goals.json"
          for path, key in ((goals, "goals_sha256"), (source / "configs/analysis-scope.json", "scope_sha256")):
              if hashlib.sha256(path.read_bytes()).hexdigest() != saved[key]:
                  raise ValueError("original scope or goals changed")
          if saved["stages"] != json.loads(goals.read_bytes())["research_roadmap_20261124"]["stages"]:
              raise ValueError("registered stage thresholds changed")
          PY
      - name: Recover earlier results, named starting lineups and the observed bookmaker entries
        run: python -B workspace-updates/20261125-epl-stage-windows/nov25-evidence/verify.py
