name: Verify R10 UEFA nine-fixture supplement
on:
  pull_request:
    paths:
      - 'workspace-updates/20261125-r10-ucl-nine-completion/**'
      - 'workspace-updates/20261125-r10-shot-conversion/**'
      - '.github/workflows/r10-ucl-nine-supplement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original R10 registration and nine-fixture archive
        run: python -B workspace-updates/20261125-r10-ucl-nine-completion/verify.py
