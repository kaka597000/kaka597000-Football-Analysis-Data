name: Verify R17 schedule-density evidence
on:
  pull_request:
    paths:
      - 'workspace-updates/20261125-r17-schedule/**'
      - '.github/workflows/r17-schedule-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R17: workspace-updates/20261125-r17-schedule
      R5: workspace-updates/20261123-all-scope-kpi
      R7: workspace-updates/20261123-prematch-literature
      R10: workspace-updates/20261125-r10-shot-conversion
      PYTHONPATH: source/runtime
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/mpl-r17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: pin
        shell: python
        run: |
          import os, pathlib, re
          revision = (pathlib.Path(os.environ['R17']) / 'source-commit.txt').read_text().strip()
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise ValueError('R17 source commit pin must be a full Git SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'revision={revision}', file=output)
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: ${{ steps.pin.outputs.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0
      - name: Run the pinned R17 model tests
        run: python -m unittest research_program.test_schedule_density -v
      - name: Independently refit and verify the R17 package
        run: |
          python -B "$R17/verify.py" \
            --source "$GITHUB_WORKSPACE/source" \
            --source-commit "$(cat "$R17/source-commit.txt")" \
            --r5 "$R5" --r7 "$R7" --r10 "$R10" \
            --forward "$R17/forward"
