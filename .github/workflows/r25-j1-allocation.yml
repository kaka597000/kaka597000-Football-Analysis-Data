name: Replay R25 J1 conditional team allocation

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r25-j1-allocation/**'
      - '.github/workflows/r25-j1-allocation.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED: workspace-updates/20261126-r25-j1-allocation
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-r9-team-score
            workspace-updates/20261126-r25-j1-allocation
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 0f38666100ab07bcedf5bd6519eccd872963e392
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Refit and compare the archived results
        shell: bash
        run: |
          (cd "$EXPECTED" && sha256sum -c SHA256SUMS)
          replay="$RUNNER_TEMP/r25-j1-replay"
          python -B -m research_program.j1_team_allocation --data . --out "$replay"
          for file in fit.json metrics.json; do
            cmp "$EXPECTED/$file" "$replay/$file"
          done
          for file in forecasts.jsonl.gz validation.jsonl.gz; do
            cmp <(gzip -dc "$EXPECTED/$file") <(gzip -dc "$replay/$file")
          done
