name: Verify R46 J1 fixed-total chance comparison

on:
  pull_request:
    paths:
      - 'workspace-updates/20261127-r46-j1-process-at-fixed-total/**'
      - '.github/workflows/r46-j1-process-at-fixed-total.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261127-r46-j1-process-at-fixed-total
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261125-j1-stage-windows/registration
            workspace-updates/20261126-r26-j1-first-stage/nov28_29
            workspace-updates/20261126-j1-recent-process
            workspace-updates/20261126-r28-j1-process-forward
            workspace-updates/20261127-r46-j1-process-at-fixed-total
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: f016e8931d6a40ec1b622010a5116d21ab69399c
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Replay both fixed-total arms and verify all first-issue receipts
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261127-r46-j1-process-at-fixed-total/protocol.json
          python -B -m research_program.j1_process_at_fixed_total --data . --check "$RUNNER_TEMP/r46-check.json"
          cmp "$PACKAGE/prematch-comparison.json" "$RUNNER_TEMP/r46-check.json"
          python -B -m research_program.j1_process_at_fixed_total --data . --verify "$PACKAGE/issued"
