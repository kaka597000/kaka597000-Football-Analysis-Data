name: Verify the Brazilian local-day first and same-book market
on:
  pull_request:
    paths:
      - 'workspace-updates/20261125-brazil-daily-first/**'
      - '.github/workflows/brazil-local-day-first.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 8a8f3fa66af666b655b4646fd7b0780e0ae831c2
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0
      - run: python -B workspace-updates/20261125-brazil-daily-first/verify.py
        env:
          PYTHONPATH: source/runtime
          NPY_DISABLE_CPU_FEATURES: AVX512F
          OPENBLAS_CORETYPE: Haswell
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
