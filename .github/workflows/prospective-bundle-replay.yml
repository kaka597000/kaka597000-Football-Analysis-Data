name: Replay retained forward bundles
on:
  pull_request:
    paths:
      - .github/workflows/prospective-bundle-replay.yml
      - runtime/install_forward_overlay.py
      - workspace-updates/20261118-prospective-bundle/replay.py
      - workspace-updates/20261118-prospective-bundle/before.json
      - workspace-updates/20261118-prospective-bundle/after.json
  push:
    branches: [main]
    paths:
      - .github/workflows/prospective-bundle-replay.yml
      - runtime/install_forward_overlay.py
      - workspace-updates/20261118-prospective-bundle/replay.py
      - workspace-updates/20261118-prospective-bundle/before.json
      - workspace-updates/20261118-prospective-bundle/after.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - version: before
            overlay: 83aa58916555ac0885e164d9882384a829fd1843
          - version: after
            overlay: fbed25e9648e4ba4061042b7f97b6a2f23f1213c
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
          sparse-checkout: |
            runtime
            workspace-updates/20261118-prospective-bundle
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: inputs
          ref: 9804e58e805db9039a5031c0e205a32cbd5f6de2
          sparse-checkout: |
            future/bundle-v2
            future/state
            future/ucl-bundle-v2
            future/ucl-state
            future/runtime-revisions
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          path: inference
          ref: 6639867d502a2dfe53a9a235c8761f8ee6b91533
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          path: overlay
          ref: ${{ matrix.overlay }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the isolated original runtime path
        run: |
          python -m pip install -r inference/requirements.txt lightgbm==4.6.0
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace
          cp -a inference /workspace/Football-Analysis
      - name: Install the previous deployed files from their recorded hashes
        if: matrix.version == 'before'
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          receipt = json.loads(Path('inputs/future/runtime-revisions/44216776631-1.json').read_bytes())
          for path, expected in receipt['overlay_files_sha256'].items():
              source = Path('overlay') / path
              assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
              shutil.copyfile(source, Path('/workspace/Football-Analysis') / path)
          PY
      - name: Install both new modules using the production entry point
        if: matrix.version == 'after'
        run: python audit/runtime/install_forward_overlay.py --base /workspace/Football-Analysis --overlay overlay --future inputs/future --receipt "$RUNNER_TEMP/installation.json"
      - name: Restore, review, re-export and compare every result
        env:
          REVISION_LABEL: ${{ matrix.version }}
        run: |
          evidence=audit/workspace-updates/20261118-prospective-bundle
          python "$evidence/replay.py" --future inputs/future --out "$RUNNER_TEMP/actual.json"
          diff -u "$evidence/$REVISION_LABEL.json" "$RUNNER_TEMP/actual.json"
