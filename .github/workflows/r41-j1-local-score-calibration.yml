name: Reproduce the R41 J1 local score calibration

on:
  pull_request:
    paths:
      - 'workspace-updates/20261127-r41-j1-local-score-calibration/**'
      - '.github/workflows/r41-j1-local-score-calibration.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261127-r41-j1-local-score-calibration
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261127-r41-j1-local-score-calibration
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 024c42d423cbccfc4ab7a7e56a30790d7b84c243
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Rebuild signed R7 controls and replay the calibration
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261127-r41-j1-local-score-calibration/protocol.json
          python -B -m research_program.j1_local_score_calibration --data . --out "$RUNNER_TEMP/r41-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r41-replay"
