name: Reproduce R34 European winning-margin research

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r34-europe-winning-margin/**'
      - 'workspace-updates/20261126-market-clock-provenance/**'
      - '.github/workflows/r34-europe-winning-margin.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-r34-europe-winning-margin
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-r13-domestic-form
            workspace-updates/20261126-europe-first-display
            workspace-updates/20261126-market-clock-provenance
            workspace-updates/20261126-r34-europe-winning-margin
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: ba2407d61e442ba617b86e33543e1fca3e5cf113
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Rebuild the historical results and read back all 18 pregame freezes
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          (cd workspace-updates/20261126-market-clock-provenance && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261126-r34-europe-winning-margin/protocol.json
          python -B -m research_program.europe_winning_margin --data . --out "$RUNNER_TEMP/r34-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r34-replay"
          python -B "$PACKAGE/forward.py" review --out "$RUNNER_TEMP/r34-status.json"
          jq -e '.registered == 18 and .verified == 0 and .comparisons.vs_r13.pending == 18' "$RUNNER_TEMP/r34-status.json"
