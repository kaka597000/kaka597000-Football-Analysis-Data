name: Replay goal-state first-score and direction study
on:
  workflow_dispatch:
  push:
    paths:
      - 'workspace-updates/20261123-goal-state/**'
      - '.github/workflows/goal-state-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
          sparse-checkout: |
            workspace-updates/20261123-goal-state
            workspace-updates/20261123-kpi-ranking
            workspace-updates/20261123-team-strength
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: bec7253351c18eb9e8200f91be69fc049be41e06
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/requirements.txt lightgbm==4.6.0
      - run: python data/workspace-updates/20261123-goal-state/replay.py --data data --code code
