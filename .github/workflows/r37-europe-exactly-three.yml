name: Reproduce R37 European exactly-three allocation

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r37-europe-exactly-three/**'
      - '.github/workflows/r37-europe-exactly-three.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-r37-europe-exactly-three
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-r13-domestic-form
            workspace-updates/20261126-r36-europe-three-goal-coverage
            workspace-updates/20261126-r37-europe-exactly-three
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 12de69b106ab8496ef10bc2211ebe03cabcbc9cb
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Reproduce the exact-three replay and check the original total-score entry point
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261126-r37-europe-exactly-three/protocol.json
          python -B -m research_program.europe_exactly_three --data . --out "$RUNNER_TEMP/r37-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r37-replay"
          python -B -m research_program.europe_three_goal_coverage --data . --out "$RUNNER_TEMP/r36-regression"
          diff -qr workspace-updates/20261126-r36-europe-three-goal-coverage/replay "$RUNNER_TEMP/r36-regression"
