# Existing user-authorized schedule. Collector diagnostics have their own immutable pin.
# Training and locked inference stay on the original code revision.
# Only market input attachment, polling and accounting receive the overlay below.
name: WCPP private unattended research
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, train]
        default: collect
  schedule:
    - cron: '17 */6 * * *'
    - cron: '37 2 * * *'
permissions:
  contents: write
concurrency:
  group: wcpp-private-research-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: private-state
          ref: main
          sparse-checkout: |
            .github
            config
            runtime
            seed
            candidates
            raw
            runs
            kor1
            future
            market
      - name: Read pinned public code
        uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 6639867d502a2dfe53a9a235c8761f8ee6b91533
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select bounded job
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE_SPEC: ${{ github.event.schedule }}
        run: |
          mode=collect
          if [ "$REQUESTED_MODE" = train ] || [ "$SCHEDULE_SPEC" = '37 2 * * *' ]; then mode=train; fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - name: Read verified collector-only revision
        if: steps.mode.outputs.value == 'collect'
        uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 8488660427610e0fbf6df9a6d356e84f6ec66b7b
          path: collector-code
          persist-credentials: false
      - name: Install CPU inference and training dependencies
        run: python -m pip install -r code/requirements.txt lightgbm==4.6.0
      - name: Collect or train candidate only
        working-directory: code
        env:
          JOB_MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          # kor.1 stays registered; omit only its unsupported ESPN request here.
          if [ "$JOB_MODE" = collect ]; then
            python ../private-state/runtime/collect_kor1.py omit-espn --state-dir ../private-state
          fi
          set +e
          if [ "$JOB_MODE" = collect ]; then
            (cd ../collector-code && python -m runtime.automation.run collect --state-dir ../private-state --max-collection-seconds 90)
          else
            python -m runtime.automation.run train --state-dir ../private-state --max-collection-seconds 90
          fi
          status=$?
          set -e
          if [ "$JOB_MODE" = collect ]; then
            git -C ../private-state checkout -- config/scopes.json
          fi
          exit "$status"
      - name: Restore scopes.json
        if: always()
        working-directory: private-state
        run: git checkout -- config/scopes.json
      - name: Collect kor.1 with audited public candidate fallback
        if: steps.mode.outputs.value == 'collect'
        working-directory: private-state
        timeout-minutes: 1
        env:
          WCPP_5DOLLAR_API_KEY: ${{ secrets.WCPP_5DOLLAR_API_KEY }}
          WCPP_API_FOOTBALL_KEY: ${{ secrets.WCPP_API_FOOTBALL_KEY }}
        run: python runtime/collect_kor1.py collect --state-dir .
      - name: Validate bounded source-timed Nations League market snapshots
        if: always() && steps.mode.outputs.value == 'collect'
        working-directory: collector-code
        timeout-minutes: 1
        env:
          WCPP_ODDS_API_KEY: ${{ secrets.WCPP_ODDS_API_KEY }}
          THE_ODDS: ${{ secrets.THE_ODDS }}
          MARKET_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m runtime.automation.market_snapshot --market-max-age-seconds 3600 --out "../private-state/market/runs/$MARKET_RUN_ID"
      - name: Capture and review locked future populations
        if: always() && steps.mode.outputs.value == 'collect'
        working-directory: code
        timeout-minutes: 1
        env:
          RUNTIME_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          base=Path.cwd(); overlay=base.parent/'collector-code'; state=base.parent/'private-state'
          def revision(path):
              return subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip()
          # Assert locked inference identities before updating transport/accounting.
          domestic=json.loads((state/'future/bundle-v2/manifest.json').read_text())
          ucl=json.loads((state/'future/ucl-bundle-v2/manifest.json').read_text())
          hashes=dict(domestic['protocol']['source_files_sha256'])
          hashes.update({k:v for k,v in ucl['protocol']['files_sha256'].items() if '/Football-Analysis/runtime/' in k})
          hashes['/workspace/Football-Analysis/runtime/research_program/ucl_refresh_review.py']=ucl['review_source_sha256']
          for path,expected in hashes.items():
              actual=base/'runtime'/path.split('/runtime/',1)[1]
              if hashlib.sha256(actual.read_bytes()).hexdigest()!=expected:
                  raise ValueError('locked inference/review source differs from protocol')
          paths=('runtime/automation/prospective_cycle.py',
                 'runtime/automation/market_bridge.py',
                 'runtime/automation/result_queue.py',
                 'runtime/research_program/promotion_review.py',
                 'runtime/v2_test/evaluation.py')
          locked={'runtime/'+path.split('/runtime/',1)[1] for path in hashes}
          if locked.intersection(paths):
              raise ValueError('accounting overlay must not replace locked protocol sources')
          files={}
          for name in paths:
              relative=Path(name)
              shutil.copyfile(overlay/relative,base/relative)
              files[str(relative)]=hashlib.sha256((base/relative).read_bytes()).hexdigest()
          for path,expected in hashes.items():
              actual=base/'runtime'/path.split('/runtime/',1)[1]
              if hashlib.sha256(actual.read_bytes()).hexdigest()!=expected:
                  raise ValueError('locked source changed after accounting overlay')
          receipt={'base_commit':revision(base),'polling_overlay_commit':revision(overlay),
                   'evaluation_overlay_commit':revision(overlay),
                   'overlay_files_sha256':files,'locked_protocol_sources_verified':True,
                   'inference_source_changed':False,'active_model_changed':False}
          out=state/'future/runtime-revisions';out.mkdir(exist_ok=True)
          with (out/(os.environ['RUNTIME_RUN_ID']+'.json')).open('x') as f:
              json.dump(receipt,f,indent=2)
          print(json.dumps(receipt))
          PY
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace
          if [ -e /workspace/Football-Analysis ]; then
            test "$(readlink -f /workspace/Football-Analysis)" = "$GITHUB_WORKSPACE/code"
          else
            ln -s "$GITHUB_WORKSPACE/code" /workspace/Football-Analysis
          fi
          python -m runtime.automation.prospective_cycle cycle --bundle ../private-state/future/bundle-v2 --market-dir ../private-state/market --market-provider the-odds-api --market-provider infersports --market-bookmaker pinnacle --max-captures 1 --max-result-requests 2 --max-seconds 20
          python -m runtime.automation.prospective_cycle review-ucl --bundle ../private-state/future/ucl-bundle-v2 --max-result-requests 2 --max-seconds 20
      - name: Save private audit and data
        if: always()
        working-directory: private-state
        run: |
          git config user.name 'WCPP automation'
          git config user.email 'wcpp-automation@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Update private research state'
            git push origin HEAD:main
          fi
