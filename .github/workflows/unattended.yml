# Existing user-authorized schedule. Collector diagnostics have their own immutable pin.
# Training and locked inference stay on the original code revision.
# Only market input attachment, polling and accounting receive the overlay below.
name: WCPP private unattended research
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, train]
        default: collect
  schedule:
    - cron: '17 */6 * * *'
    - cron: '37 2 * * *'
permissions:
  contents: write
concurrency:
  group: wcpp-private-research-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: private-state
          ref: main
          sparse-checkout: |
            .github
            config
            runtime
            seed
            candidates
            raw
            runs
            kor1
            future
            market
            workspace-updates/20261118-three-arm/batch
            workspace-updates/20261118-three-arm/registration
            workspace-updates/20261118-three-arm/identity
            workspace-updates/20261118-sequence/forward
            workspace-updates/20261118-transformer/forward
            workspace-updates/20261118-sequence/coverage
      - name: Read pinned public code
        uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 6639867d502a2dfe53a9a235c8761f8ee6b91533
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select bounded job
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE_SPEC: ${{ github.event.schedule }}
        run: |
          mode=collect
          if [ "$REQUESTED_MODE" = train ] || [ "$SCHEDULE_SPEC" = '37 2 * * *' ]; then mode=train; fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - name: Read verified collector-only revision
        if: steps.mode.outputs.value == 'collect'
        uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: fbed25e9648e4ba4061042b7f97b6a2f23f1213c
          path: collector-code
          persist-credentials: false
      - name: Install CPU inference and training dependencies
        run: python -m pip install -r code/requirements.txt lightgbm==4.6.0
      - name: Collect or train candidate only
        working-directory: code
        env:
          JOB_MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          # kor.1 stays registered; omit only its unsupported ESPN request here.
          if [ "$JOB_MODE" = collect ]; then
            python ../private-state/runtime/collect_kor1.py omit-espn --state-dir ../private-state
            # Brazil is collection-only; restore the original training scopes below.
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path('../private-state/config/scopes.json')
          scopes = json.loads(path.read_text())
          brazil = {'cohort': 'bra.1', 'competition': 'bra.1', 'stages': ['regular'],
                    'gender': 'men', 'age': 'senior'}
          matches = [s for s in scopes if s.get('cohort') == 'bra.1']
          if matches and matches != [brazil]:
              raise ValueError('conflicting Brazil collection scope')
          if not matches:
              scopes.append(brazil)
          path.write_text(json.dumps(scopes, ensure_ascii=False, indent=2) + '\n')
          PY
          fi
          set +e
          if [ "$JOB_MODE" = collect ]; then
            (cd ../collector-code && python -m runtime.automation.run collect --state-dir ../private-state --max-collection-seconds 90)
          else
            python -m runtime.automation.run train --state-dir ../private-state --max-collection-seconds 90
          fi
          status=$?
          set -e
          if [ "$JOB_MODE" = collect ]; then
            git -C ../private-state checkout -- config/scopes.json
          fi
          exit "$status"
      - name: Restore scopes.json
        if: always()
        working-directory: private-state
        run: git checkout -- config/scopes.json
      - name: Collect kor.1 with audited public candidate fallback
        if: steps.mode.outputs.value == 'collect'
        working-directory: private-state
        timeout-minutes: 1
        env:
          WCPP_5DOLLAR_API_KEY: ${{ secrets.WCPP_5DOLLAR_API_KEY }}
          WCPP_API_FOOTBALL_KEY: ${{ secrets.WCPP_API_FOOTBALL_KEY }}
        run: python runtime/collect_kor1.py collect --state-dir .
      - name: Validate bounded source-timed Nations League market snapshots
        if: always() && steps.mode.outputs.value == 'collect'
        working-directory: collector-code
        timeout-minutes: 1
        env:
          WCPP_ODDS_API_KEY: ${{ secrets.THEODDSAPI || secrets.WCPP_ODDS_API_KEY || secrets.THE_ODDS }}
          MARKET_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m runtime.automation.market_snapshot --market-max-age-seconds 3600 --out "../private-state/market/runs/$MARKET_RUN_ID"
      - name: Collect bounded Brazil Serie A market snapshots
        if: always() && steps.mode.outputs.value == 'collect'
        working-directory: collector-code
        timeout-minutes: 1
        env:
          WCPP_ODDS_API_KEY: ${{ secrets.THEODDSAPI || secrets.WCPP_ODDS_API_KEY || secrets.THE_ODDS }}
          MARKET_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m runtime.automation.market_snapshot --competition bra.1 --market-max-age-seconds 3600 --out "../private-state/market/runs/$MARKET_RUN_ID-bra1"
      - name: Collect bounded InferSports Nations fallback
        if: always() && steps.mode.outputs.value == 'collect'
        working-directory: collector-code
        timeout-minutes: 1
        env:
          WCPP_INFERSPORTS_KEY: ${{ secrets.INFER || secrets.WCPP_INFERSPORTS_KEY || secrets.infer_yapan_zhishu }}
          MARKET_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m runtime.automation.infer_market_snapshot --max-pages 3 --max-events 8 --out "../private-state/market/runs/$MARKET_RUN_ID-infer"
      - name: Capture and review locked future populations
        if: always() && steps.mode.outputs.value == 'collect'
        working-directory: code
        timeout-minutes: 1
        env:
          RUNTIME_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python ../private-state/runtime/install_forward_overlay.py --base . --overlay ../collector-code --future ../private-state/future --receipt "../private-state/future/runtime-revisions/$RUNTIME_RUN_ID.json"
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace
          if [ -e /workspace/Football-Analysis ]; then
            test "$(readlink -f /workspace/Football-Analysis)" = "$GITHUB_WORKSPACE/code"
          else
            ln -s "$GITHUB_WORKSPACE/code" /workspace/Football-Analysis
          fi
          python -m runtime.automation.prospective_cycle cycle --bundle ../private-state/future/bundle-v2 --market-dir ../private-state/market --market-provider the-odds-api --market-provider infersports --market-bookmaker pinnacle --max-captures 1 --max-result-requests 2 --max-seconds 20
          python -m runtime.automation.prospective_cycle review-ucl --bundle ../private-state/future/ucl-bundle-v2 --max-result-requests 2 --max-seconds 20
      - name: Review frozen Nations repair population
        if: always() && steps.mode.outputs.value == 'collect'
        working-directory: collector-code
        timeout-minutes: 1
        run: python -m runtime.automation.nations_repair_cycle --bundle ../private-state/future/nations-repair-bundle --state ../private-state/future/nations-repair-state --max-requests 6 --max-seconds 40
      - name: Load frozen three-arm research reviewer
        id: three_arm_source
        if: always() && steps.mode.outputs.value == 'collect'
        uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 3fd411a4a34769e3192816631f2fa90948ad4ac9
          path: three-arm-code
          persist-credentials: false
      - name: Settle the registered Brazil calibration batch
        if: always() && steps.three_arm_source.outcome == 'success' && steps.mode.outputs.value == 'collect'
        timeout-minutes: 1
        working-directory: private-state
        run: |
          experiment=workspace-updates/20261118-three-arm
          export PYTHONPATH="$GITHUB_WORKSPACE/three-arm-code:$GITHUB_WORKSPACE/three-arm-code/runtime"
          python runtime/poll_three_arm_results.py --batch "$experiment/batch" --registration "$experiment/registration/protocol.json" --state-dir .
          python -m research_program.three_arm_review --batch "$experiment/batch" --state-dir . --out "$experiment/batch/review.json"
      - name: Load verified sequence research revision
        id: sequence_revision
        if: always() && steps.mode.outputs.value == 'collect'
        uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 7458322a61534a907efd2211b551b419f6929da0
          path: sequence-code
          persist-credentials: false
      - name: Review fixed sequence forecasts
        if: always() && steps.sequence_revision.outcome == 'success'
        working-directory: private-state
        env:
          PYTHONPATH: ${{ github.workspace }}/sequence-code/runtime
        run: python -m research_program.sequence_forward review --batch workspace-updates/20261118-sequence/forward --state-dir .
      - name: Measure prematch coverage for the registered fixtures
        if: always() && steps.sequence_revision.outcome == 'success'
        working-directory: private-state
        timeout-minutes: 2
        env:
          PYTHONPATH: ${{ github.workspace }}/sequence-code/runtime
          WCPP_BSD_API_KEY: ${{ secrets.BSD }}
        run: python -m data_sources.research_supplement --data-root . --out workspace-updates/20261118-sequence/coverage
      - name: Load registered Transformer research revision
        id: transformer_revision
        if: always() && steps.mode.outputs.value == 'collect'
        uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 0751528579d97587fb649ebea6ad51d148de804b
          path: transformer-code
          persist-credentials: false
      - name: Settle the fixed four-model Transformer comparison
        if: always() && steps.transformer_revision.outcome == 'success'
        working-directory: private-state
        env:
          PYTHONPATH: ${{ github.workspace }}/transformer-code/runtime
        run: python -m research_program.transformer_forward review --batch workspace-updates/20261118-transformer/forward --state-dir .
      - name: Save private audit and data
        if: always()
        working-directory: private-state
        run: |
          git config user.name 'WCPP automation'
          git config user.email 'wcpp-automation@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Update private research state'
            git push origin HEAD:main
          fi
