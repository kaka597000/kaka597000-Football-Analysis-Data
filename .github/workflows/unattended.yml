# Installed only in the private data repository. Football-Analysis checkout uses no token.
# kor.1 reads WCPP_5DOLLAR_API_KEY and WCPP_API_FOOTBALL_KEY from repository secrets.
name: WCPP private unattended research
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, train]
        default: collect
  schedule:
    - cron: '17 */6 * * *'
    - cron: '37 2 * * *'
permissions:
  contents: write
concurrency:
  group: wcpp-private-research-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: private-state
          # A queued dispatch carries an older event SHA; load latest serialized state.
          ref: main
      - name: Read pinned public code
        uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: c52326438ecaaf999e67d61c7462f997071e946c
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select bounded job
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE_SPEC: ${{ github.event.schedule }}
        run: |
          mode=collect
          if [ "$REQUESTED_MODE" = train ] || [ "$SCHEDULE_SPEC" = '37 2 * * *' ]; then mode=train; fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - name: Install CPU training dependencies
        if: steps.mode.outputs.value == 'train'
        run: python -m pip install -r code/requirements.txt lightgbm==4.6.0
      - name: Collect or train candidate only
        working-directory: code
        env:
          JOB_MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          # The pinned collector uses the competition code as an ESPN path.
          # kor.1 stays in scopes.json and is removed only for this call.
          if [ "$JOB_MODE" = collect ]; then
            python ../private-state/runtime/collect_kor1.py omit-espn --state-dir ../private-state
          fi
          set +e
          python -m runtime.automation.run "$JOB_MODE" --state-dir ../private-state --max-collection-seconds 150
          status=$?
          set -e
          if [ "$JOB_MODE" = collect ]; then
            git -C ../private-state checkout -- config/scopes.json
          fi
          exit "$status"
      - name: Restore scopes.json
        if: always()
        working-directory: private-state
        run: git checkout -- config/scopes.json
      - name: Collect kor.1 via 5Dollar, API-Football fallback
        if: steps.mode.outputs.value == 'collect'
        working-directory: private-state
        timeout-minutes: 2
        env:
          WCPP_5DOLLAR_API_KEY: ${{ secrets.WCPP_5DOLLAR_API_KEY }}
          WCPP_API_FOOTBALL_KEY: ${{ secrets.WCPP_API_FOOTBALL_KEY }}
        run: python runtime/collect_kor1.py collect --state-dir .
      - name: Save private audit and data
        if: always()
        working-directory: private-state
        run: |
          git config user.name 'WCPP automation'
          git config user.email 'wcpp-automation@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Update private research state'
            git push origin HEAD:main
          fi
