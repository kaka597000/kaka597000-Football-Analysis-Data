name: Replay score-gap experiment and first issues
on:
  workflow_dispatch:
  push:
    paths:
      - 'workspace-updates/20261123-score-gap-repair/**'
      - '.github/workflows/score-gap-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-score-gap-repair
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 54dc8796472efe20d2cb3dde4df35a63f3dc1628
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/requirements.txt lightgbm==4.6.0
      - run: >-
          python data/workspace-updates/20261123-score-gap-repair/verify.py
          --archive data/workspace-updates/20261123-score-gap-repair
          --prior data/workspace-updates/20261123-all-scope-kpi --code code
