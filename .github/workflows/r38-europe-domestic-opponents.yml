name: Reproduce R38 European domestic opposition and first issues

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r38-europe-domestic-opponents/**'
      - '.github/workflows/r38-europe-domestic-opponents.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-r38-europe-domestic-opponents
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-r13-domestic-form
            workspace-updates/20261126-europe-first-display
            workspace-updates/20261126-r38-europe-domestic-opponents
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 2d7754822cc36e0387c61a140a4309be7d6e8ead
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Reproduce the history and verify the 18 actual pregame freezes
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261126-r38-europe-domestic-opponents/protocol.json
          python -B -m research_program.europe_domestic_opponents --data . --out "$RUNNER_TEMP/r38-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r38-replay"
          python -B "$PACKAGE/forward.py" verify
