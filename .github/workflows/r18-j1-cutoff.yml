name: Verify R18 J1 cutoff evidence
on:
  pull_request:
    paths:
      - 'workspace-updates/20261125-r15-j1-lineups/**'
      - 'workspace-updates/20261125-r18-j1-cutoff/**'
      - '.github/workflows/r18-j1-cutoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R18: workspace-updates/20261125-r18-j1-cutoff
      R5: workspace-updates/20261123-all-scope-kpi
      R7: workspace-updates/20261123-prematch-literature
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TMPDIR: /tmp
      MPLCONFIGDIR: /tmp/mpl-r18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 102e4c5b4b9e3897c36686a227374d36a68c484b
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0
      - name: Independently replay and verify both historical windows
        run: |
          python -B "$R18/verify.py" \
            --package "$R18" --source source --r5 "$R5" --r7 "$R7"
