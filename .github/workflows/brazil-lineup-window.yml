name: Registered Brazil lineup windows, 18 November 2026
on:
  schedule:
    - cron: '11,41 21-23 18 11 *'
    - cron: '6 0 19 11 *'
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    concurrency:
      group: wcpp-private-research-state
      cancel-in-progress: false
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check the registered matchday
        id: window
        run: |
          case "$(date -u +%Y%m%d%H)" in
            2026111821|2026111822|2026111823|2026111900) echo "active=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
        with:
          path: data
          ref: main
          sparse-checkout: |
            config
            runtime
            market
            workspace-updates/20261118-three-arm/registration
            workspace-updates/20261118-three-arm/batch
            workspace-updates/20261118-three-arm/identity
            workspace-updates/20261118-sequence/coverage
      - name: Read source versions
        id: versions
        if: steps.window.outputs.active == 'true'
        run: python3 data/runtime/source_versions.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
        with:
          repository: kaka597000/Football-Analysis
          ref: ${{ steps.versions.outputs.sequence_code }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Install reading and validation dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install -r source/requirements.txt
      - name: Retain source-timed Brazil prices
        if: steps.window.outputs.active == 'true'
        working-directory: source
        env:
          WCPP_ODDS_API_KEY: ${{ secrets.THEODDSAPI || secrets.WCPP_ODDS_API_KEY || secrets.THE_ODDS }}
        run: python -m runtime.automation.market_snapshot --competition bra.1 --market-max-age-seconds 3600 --out "../data/market/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-bra1"
      - name: Capture official lineups and measure coverage
        if: always() && steps.window.outputs.active == 'true'
        working-directory: data
        env:
          PYTHONPATH: ${{ github.workspace }}/source/runtime
          WCPP_BSD_API_KEY: ${{ secrets.BSD }}
        run: python -m data_sources.research_supplement --data-root . --out workspace-updates/20261118-sequence/coverage
      - name: Retain this observation
        if: always() && steps.window.outputs.active == 'true'
        working-directory: data
        run: |
          git config user.name 'WCPP automation'
          git config user.email 'wcpp-automation@users.noreply.github.com'
          git add -- market workspace-updates/20261118-sequence/coverage
          if ! git diff --cached --quiet; then
            git commit -m 'Retain timestamped observations from Brazil lineup window'
            git push origin HEAD:main
          fi
  close:
    if: always() && github.event.schedule == '6 0 19 11 *'
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Close this matchday-only timer after its final observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/brazil-lineup-window.yml/disable"
