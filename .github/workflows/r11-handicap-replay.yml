name: Verify R11 same-book handicap replay
on:
  pull_request:
    paths:
      - 'workspace-updates/20261125-r11-asian-handicap/**'
      - '.github/workflows/r11-handicap-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python workspace-updates/20261125-r11-asian-handicap/verify.py
