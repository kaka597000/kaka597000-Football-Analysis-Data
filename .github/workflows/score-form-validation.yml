name: Verify frozen league score form
on:
  pull_request:
    paths:
      - workspace-updates/20261122-score-form/**
      - .github/workflows/score-form-validation.yml
  push:
    branches: [main, research/score-form-evidence-20261122]
    paths:
      - workspace-updates/20261122-score-form/**
      - .github/workflows/score-form-validation.yml
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 1196b57c1369193e38b9b0c5c05addaf7d270094
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements.txt scikit-learn==1.8.0 lightgbm==4.6.0
      - run: python data/workspace-updates/20261122-score-form/verify_evidence.py --source source
