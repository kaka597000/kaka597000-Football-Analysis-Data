name: Verify R20 J1 halftime history and ten prospective firsts
on:
  pull_request:
    paths:
      - 'workspace-updates/20261125-r20-j1-halftime/**'
      - 'workspace-updates/20261125-r15-j1-lineups/**'
      - 'workspace-updates/20261125-r10-shot-conversion/**'
      - 'workspace-updates/20261123-prematch-literature/**'
      - 'workspace-updates/20261123-all-scope-kpi/**'
      - '.github/workflows/r20-j1-halftime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-and-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R20: workspace-updates/20261125-r20-j1-halftime
      SOURCE_PIN: 4a70ba43df38750e14ddcb11a6b585064bd272ec
      ORIGINAL_REGISTRATION: 8b718c63b4620a34d8640d7df2fa7efa2849c3a24bea15cb058c470ce3614f65
      ORIGINAL_RECEIPTS: f84db93bd24092db6d84dfd039996c5f738d2c6561c32642b5cc9ae69041195f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: ${{ env.SOURCE_PIN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision the numerical environment
        run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 threadpoolctl==3.7.0
      - name: Rebuild the observations, refit twice, and compare the original prematch firsts offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_PIN"
          echo "ff6321639ce54efda4ee8674440b16e1b469e898f36396ba83aa88e0f8718671  $R20/release/manifest.json" | sha256sum --check
          py="$(command -v python)"
          offline=(sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups
                   env "LD_LIBRARY_PATH=$(dirname "$py")/../lib" "$py" -B)
          "${offline[@]}" -m unittest discover -v -s "$R20" -p 'test_*.py'
          "${offline[@]}" "$R20/package.py" verify --data-root . --source source --source-commit "$SOURCE_PIN" \
            --registration-sha256 "$ORIGINAL_REGISTRATION" --receipts-sha256 "$ORIGINAL_RECEIPTS"
