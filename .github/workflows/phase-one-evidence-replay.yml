name: First-stage evidence replay
on:
  push:
    branches: [data/phase-one-evidence-20261127]
    paths:
      - .github/workflows/phase-one-evidence-replay.yml
      - workspace-updates/20261127-phase-one-evidence/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase-one-evidence-replay.yml
      - workspace-updates/20261127-phase-one-evidence/**
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
          sparse-checkout: workspace-updates/20261127-phase-one-evidence
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: inputs
          ref: 87ef46859990a8760b4af361eef3186f5090d319
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /workspace-updates/20261123-all-scope-kpi/results/scorecard.csv
            /workspace-updates/20261123-all-scope-kpi/forward-first-issues.tar.gz
            /workspace-updates/20261123-all-scope-kpi/models/eng.1.tar.gz
            /workspace-updates/20261123-all-scope-kpi/models/esp.1.tar.gz
            /workspace-updates/20261123-all-scope-kpi/models/fra.1.tar.gz
            /workspace-updates/20261123-all-scope-kpi/models/ger.1.tar.gz
            /workspace-updates/20261123-all-scope-kpi/models/ita.1.tar.gz
            /workspace-updates/20261123-all-scope-kpi/models/uefa.europa.tar.gz
            /workspace-updates/20261123-all-scope-kpi/models/uefa.europa.conf.tar.gz
            /workspace-updates/20261123-prematch-literature/models/uefa.europa.tar.gz
            /workspace-updates/20261123-prematch-literature/models/uefa.europa.conf.tar.gz
            /workspace-updates/20261123-prematch-literature/first-issues.tar.gz
            /workspace-updates/20261123-prematch-literature/models/eng.1.tar.gz
            /workspace-updates/20261123-prematch-literature/models/esp.1.tar.gz
            /workspace-updates/20261123-prematch-literature/models/fra.1.tar.gz
            /workspace-updates/20261123-prematch-literature/models/ger.1.tar.gz
            /workspace-updates/20261123-prematch-literature/models/ita.1.tar.gz
            /workspace-updates/20261125-r8-prematch/score/first-issues.tar.gz
            /workspace-updates/20261125-r8-prematch/score/forecasts.tar.gz
            /workspace-updates/20261125-r14-territory-press/forward/first-issues.tar.gz
            /workspace-updates/20261125-r21-score-dependence/forward/
            /workspace-updates/20261125-r22-draw-preserving/forward/
            /workspace-updates/20261125-r23-penalty-opportunity/forward/
            /workspace-updates/20261125-forward-settlement/nov25/evidence.tar.gz
            /workspace-updates/20261125-j1-stage-windows/registration/
            /workspace-updates/20261125-j1-stage-windows/nov25/
            /workspace-updates/20261125-r13-domestic-form/replay/forecasts.tar.gz
            /workspace-updates/20261125-r13-domestic-form/forward/first-issues.tar.gz
            /workspace-updates/20261125-r13-domestic-form/inputs/domestic.tar.gz
            /workspace-updates/20261125-r13-domestic-form/manifest.json
            /workspace-updates/20261126-europe-first-display/capture-plan/round1.json
            /workspace-updates/20261126-europe-first-display/capture-plan/round2.json
            /workspace-updates/20261126-europe-first-display/registration/
            /workspace-updates/20261126-europe-first-display/calendar/captures.json
            /workspace-updates/20261126-europe-first-display/calendar/uel-2026-12-10.json.gz
            /workspace-updates/20261126-europe-first-display/calendar/uecl-2026-12-10.json.gz
            /workspace-updates/20261126-europe-first-display/calendar/uefa-uel.json.gz
            /workspace-updates/20261126-europe-first-display/calendar/uefa-uel-crosswalk.json
            /workspace-updates/20261126-europe-first-display/calendar/uefa-uecl.json.gz
            /workspace-updates/20261126-europe-first-display/calendar/uefa-uecl-crosswalk.json
            /workspace-updates/20261126-europe-first-display/prematch/uecl-process/captures.json
            /workspace-updates/20261126-europe-first-display/prematch/uecl-process/match-5804283.json.gz
            /workspace-updates/20261126-europe-first-display/prematch/uecl-process/match-5804302.json.gz
            /workspace-updates/20261126-europe-first-display/prematch/venue-opening/verified.json
            /workspace-updates/20261126-europe-first-display/publication/
            /workspace-updates/20261126-j1-december-windows/registration/
            /workspace-updates/20261126-j1-forward-result-review/nov25-state/
            /workspace-updates/20261126-r26-j1-first-stage/nov28_29/
            /workspace-updates/20261126-r26-j1-first-stage/evidence/public-source-snapshots.tar.gz
            /workspace-updates/20261126-r28-j1-process-forward/issued/
            /workspace-updates/20261126-r30-europe-score-dispersion/protocol.json
            /workspace-updates/20261126-r34-europe-winning-margin/issued/
            /workspace-updates/20261126-r38-europe-domestic-opponents/issued/
            /workspace-updates/20261127-europe-round1-review/j1-capture-plan.json
            /workspace-updates/20261127-europe-round1-review/review-freeze.json
            /workspace-updates/20261127-europe-round1-review/settlement/report.json
            /workspace-updates/20261127-j1-december-evidence/kickoff-packet.json
            /workspace-updates/20261127-j1-december-evidence/official/
            /workspace-updates/20261127-j1-december-readiness/prepared/team-ids.json
            /workspace-updates/20261127-j1-official-kickoff/kickoff-packet.json
            /workspace-updates/20261127-j1-official-kickoff/pregame/
            /workspace-updates/20261127-r42-j1-fixed-first-backups/issued/
            /workspace-updates/20261127-r42-j1-fixed-first-backups/SHA256SUMS
            /workspace-updates/20261127-r42-j1-fixed-first-backups/replay/history.jsonl.gz
            /workspace-updates/20261127-r42-j1-fixed-first-backups/replay/validation.jsonl.gz
            /workspace-updates/20261127-r45-j1-four-goal-path/SHA256SUMS
            /workspace-updates/20261127-r45-j1-four-goal-path/replay/forecasts.jsonl.gz
            /workspace-updates/20261127-r45-j1-four-goal-path/replay/validation.jsonl.gz
            /workspace-updates/20261127-r46-j1-process-at-fixed-total/issued/
            /workspace-updates/20261127-r49-j1-season-chance-rates/issued/
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          path: source
          ref: f73b7e6fe9da7c542c46a69dd92fcf8739a79526
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          path: r13-source
          ref: f3f3f41673492b43b3d44770e4de76d8571fccb3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/requirements.txt
      - run: python -m pip install -r source/requirements.txt
      - name: Verify stored evidence and replay the original windows
        run: |
          bundle=audit/workspace-updates/20261127-phase-one-evidence
          (cd "$bundle" && sha256sum -c SHA256SUMS)
          PYTHONPATH=source/runtime python -B "$bundle/verify.py" --data-root inputs > "$RUNNER_TEMP/verified.json"
          cmp "$bundle/verified.json" "$RUNNER_TEMP/verified.json"
      - name: Replay five verified J1 weekend results
        run: |
          bundle=audit/workspace-updates/20261127-phase-one-evidence
          day="$bundle/j1-weekend-results/20261128"
          out="$RUNNER_TEMP/j1-weekend-20261128"
          PYTHONPATH=source/runtime python -B "$day/replay.py" --original-data inputs \
            --wave-bundle "$day" --checkpoint-bundle "$bundle" --out "$out" \
            --at 2026-11-28T10:45:52+00:00
          for file in review.json first-window.json normalized-results.jsonl; do
            cmp "$day/$file" "$out/$file"
          done
      - name: Verify remaining-window market readiness
        run: |
          folder=audit/workspace-updates/20261127-phase-one-evidence/market-readiness-20261128
          PYTHONPATH=source/runtime python -B "$folder/verify.py" --data-root inputs > "$RUNNER_TEMP/market-readiness.json"
          cmp "$folder/verified.json" "$RUNNER_TEMP/market-readiness.json"
      - name: Replay the European market collector on retained sources
        run: |
          folder=audit/workspace-updates/20261127-phase-one-evidence/europe-market-collector-20261128
          out="$RUNNER_TEMP/europe-market-collector"
          PYTHONPATH=source/runtime python -B "$folder/prepare.py" --original-data inputs --source source --out "$out"
          for file in fixtures-uel.json fixtures-uecl.json team-ids.json replay.json; do
            cmp "$folder/$file" "$out/$file"
          done
      - name: Replay the fixed R13 price-input comparison
        run: |
          python -m pip install lightgbm==4.6.0 pandas==3.1.0
          folder=audit/workspace-updates/20261127-phase-one-evidence/europe-market-fallback-study-20261128
          PYTHONPATH=r13-source/runtime python -B "$folder/replay.py" --data-root inputs > "$RUNNER_TEMP/r13-market-ablation.json"
          cmp "$folder/verified.json" "$RUNNER_TEMP/r13-market-ablation.json"
      - name: Replay the R13 domestic results coverage audit
        run: |
          folder=audit/workspace-updates/20261127-phase-one-evidence/europe-r13-domestic-refresh-20261128
          out="$RUNNER_TEMP/r13-domestic-refresh"
          PYTHONPATH=r13-source/runtime python -B "$folder/replay.py" --data-root inputs --out "$out"
          for file in verified.json known-league-delta.jsonl new-league-delta.jsonl october-league-delta.jsonl; do
            cmp "$folder/$file" "$out/$file"
          done
      - name: Replay the fixed R13 market-input comparison across historical dates
        run: |
          folder=audit/workspace-updates/20261127-phase-one-evidence/europe-r13-temporal-market-20261128
          out="$RUNNER_TEMP/r13-temporal-market"
          PYTHONPATH=r13-source/runtime python -B "$folder/replay.py" --data-root inputs --out "$out"
          for file in verified.json fixtures.jsonl.gz; do
            cmp "$folder/$file" "$out/$file"
          done
      - name: Rehearse the registered UEL price inputs and locked R13 recipes
        run: |
          folder=audit/workspace-updates/20261127-phase-one-evidence/europe-r13-market-inputs-20261128
          PYTHONPATH=source/runtime python -B "$folder/rehearse.py" --data-root inputs --out "$RUNNER_TEMP/uel-prices.json"
          PYTHONPATH=r13-source/runtime python -B "$folder/rehearse_model.py" --data-root inputs --out "$RUNNER_TEMP/uel-model.json"
          cmp "$folder/verified-prices.json" "$RUNNER_TEMP/uel-prices.json"
          cmp "$folder/verified-model.json" "$RUNNER_TEMP/uel-model.json"
      - name: Replay the fixed Big Five dispersion study and weekend prior issues
        env:
          OPENBLAS_CORETYPE: Haswell
          NPY_DISABLE_CPU_FEATURES: AVX512F
        run: |
          folder=audit/workspace-updates/20261127-phase-one-evidence/big5-total-shape-20261128
          out="$RUNNER_TEMP/big5-total-shape"
          PYTHONPATH=r13-source/runtime python -B "$folder/replay.py" --data-root inputs --out "$out"
          for file in verified.json fixtures.jsonl.gz; do
            cmp "$folder/$file" "$out/$file"
          done
          PYTHONPATH=r13-source/runtime python -B "$folder/weekend.py" --data-root inputs --out "$RUNNER_TEMP/big5-weekend.json"
          cmp "$folder/weekend.json" "$RUNNER_TEMP/big5-weekend.json"
      - name: Rehearse Big Five result evidence and actual-kickoff settlement
        run: |
          folder=audit/workspace-updates/20261127-phase-one-evidence/big5-total-shape-20261128
          PYTHONPATH=r13-source/runtime python -B "$folder/settlement_rehearsal.py" --data-root inputs --out "$RUNNER_TEMP/big5-settlement.json"
          cmp "$folder/settlement-check/verified.json" "$RUNNER_TEMP/big5-settlement.json"
          PYTHONPATH=r13-source/runtime python -B "$folder/capture_check.py"
          PYTHONPATH=r13-source/runtime python -B "$folder/process_check.py" --out "$RUNNER_TEMP/big5-recent-process.json"
          cmp "$folder/recent-process/verified.json" "$RUNNER_TEMP/big5-recent-process.json"
          PYTHONPATH=r13-source/runtime python -B "$folder/opening_progress.py" --out "$RUNNER_TEMP/big5-opening.json"
          cmp "$folder/opening-live/verified.json" "$RUNNER_TEMP/big5-opening.json"
      - name: Replay Big Five first-score reordering and additional local firsts
        env:
          OPENBLAS_CORETYPE: Haswell
          NPY_DISABLE_CPU_FEATURES: AVX512F
        run: |
          folder=audit/workspace-updates/20261127-phase-one-evidence/big5-total-shape-20261128
          out="$RUNNER_TEMP/big5-first-order"
          PYTHONPATH=r13-source/runtime python -B "$folder/first_order.py" --data-root inputs --out "$out"
          for file in verified.json fixtures.jsonl.gz; do
            cmp "$folder/first-order/$file" "$out/$file"
          done
          at=$(jq -r .recorded_at "$folder/first-order/native-firsts-freeze.json")
          PYTHONPATH=r13-source/runtime python -B "$folder/settlement_additions.py" \
            --evidence-root "$folder/settlement-check" --receipts "$folder/settlement-check/pending-receipts.json" \
            --at "$at" --out "$RUNNER_TEMP/big5-settlement-additions.json"
          jq -e '.registered == 31 and .verified_finals == 0 and
            ([.per_match | to_entries[] | select(.value.registered_firsts | contains(["Current","Test"])) | .key] | sort) ==
            ["espn:401875081","espn:401882796","espn:401884723"]' "$RUNNER_TEMP/big5-settlement-additions.json"
