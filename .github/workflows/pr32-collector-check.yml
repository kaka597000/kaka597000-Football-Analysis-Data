name: PR32 collector rollout check
on:
  push:
    branches: [ops/pr32-collector-diagnostics-20261112]
    paths: [.github/workflows/pr32-collector-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: state
          sparse-checkout: |
            .github
            config
            seed
            runtime
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 46017f3795e41eef4c38692ad4809fe4b589dde9
          path: collector-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check schedule and immutable prediction pin
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml,shutil
          doc=yaml.load(Path('state/.github/workflows/unattended.yml').read_text(),Loader=yaml.BaseLoader)
          assert doc['on']['schedule']==[{'cron':'17 */6 * * *'},{'cron':'37 2 * * *'}]
          steps=doc['jobs']['research']['steps']
          old=next(s for s in steps if s.get('name')=='Read pinned public code')
          new=next(s for s in steps if s.get('name')=='Read verified collector-only revision')
          assert old['with']['ref']=='6639867d502a2dfe53a9a235c8761f8ee6b91533'
          assert new['with']['ref']=='46017f3795e41eef4c38692ad4809fe4b589dde9'
          assert next(s for s in steps if s.get('name')=='Capture and review locked future populations')['working-directory']=='code'
          root=Path('/tmp/collector-state');root.mkdir()
          for name in ('config','seed'):shutil.copytree(Path('state')/name,root/name)
          PY
          python state/runtime/collect_kor1.py omit-espn --state-dir /tmp/collector-state
      - name: Real bounded request, isolated data output
        working-directory: collector-code
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from runtime.automation.run import execute
          r=execute('/tmp/collector-state','collect',max_collection_seconds=60)
          assert r['source_commit']=='46017f3795e41eef4c38692ad4809fe4b589dde9'
          assert r['active_model_modified'] is False
          assert r['status_scope']=='REQUEST_EXECUTION_NOT_MODEL_READINESS'
          assert 'channels' in r['result'] and r['market_model_ready'] is False
          Path('/tmp/collector-check.json').write_text(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr32-collector-rollout-check
          path: /tmp/collector-check.json
          retention-days: 1
          if-no-files-found: error
