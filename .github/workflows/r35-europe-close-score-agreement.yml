name: Reproduce R35 European close-score agreement

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r35-europe-close-score-agreement/**'
      - '.github/workflows/r35-europe-close-score-agreement.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-r35-europe-close-score-agreement
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-r9-team-score
            workspace-updates/20261125-r10-shot-conversion
            workspace-updates/20261125-r13-domestic-form
            workspace-updates/20261126-r35-europe-close-score-agreement
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 088fcd0710ff67c297a83d2d3a062220aadf418e
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Rebuild the three European historical replay windows
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261126-r35-europe-close-score-agreement/protocol.json
          python -B -m research_program.europe_close_score_agreement --data . --out "$RUNNER_TEMP/r35-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r35-replay"
