name: Reproduce R45 J1 four-plus goal path

on:
  pull_request:
    paths:
      - 'workspace-updates/20261127-r45-j1-four-goal-path/**'
      - '.github/workflows/r45-j1-four-goal-path.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261127-r45-j1-four-goal-path
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261127-r42-j1-fixed-first-backups
            workspace-updates/20261127-r45-j1-four-goal-path
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: fcd7e3a1ae21dc98ba802010d9890ab4bc2727de
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Replay original J1 anchors and four-plus-score coverage
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261127-r45-j1-four-goal-path/protocol.json
          python -B -m research_program.j1_four_goal_path --data . --replay "$RUNNER_TEMP/r45-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r45-replay"
          python -B -m unittest research_program.test_j1_four_goal_path
