name: Reproduce R42 J1 backup comparison and verify pregame freeze

on:
  pull_request:
    paths:
      - 'workspace-updates/20261127-r42-j1-fixed-first-backups/**'
      - '.github/workflows/r42-j1-fixed-first-backups.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261127-r42-j1-fixed-first-backups
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-j1-stage-windows/registration
            workspace-updates/20261126-r26-j1-first-stage/nov28_29
            workspace-updates/20261127-r41-j1-local-score-calibration
            workspace-updates/20261127-r42-j1-fixed-first-backups
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 1f502f1b572d425251be657019e96628e0c7815b
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Rebuild the comparison and verify all ten original research receipts
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261127-r42-j1-fixed-first-backups/protocol.json
          python -B -m research_program.j1_fixed_first_backups --data . --replay "$RUNNER_TEMP/r42-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r42-replay"
          python -B -m research_program.j1_fixed_first_backups --data . --verify "$PACKAGE/issued"
