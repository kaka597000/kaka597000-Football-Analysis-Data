name: Replay six registered Brazil forecasts
on:
  pull_request:
    paths:
      - .github/workflows/three-arm-validation.yml
      - .github/workflows/unattended.yml
      - runtime/poll_three_arm_results.py
      - runtime/test_poll_three_arm_results.py
      - workspace-updates/20261118-three-arm/**
      - market/runs/44223152835-1-bra1/**
  push:
    branches: [main, research/three-arm-forward-20261118]
    paths:
      - .github/workflows/three-arm-validation.yml
      - .github/workflows/unattended.yml
      - runtime/poll_three_arm_results.py
      - runtime/test_poll_three_arm_results.py
      - workspace-updates/20261118-three-arm/**
      - market/runs/44223152835-1-bra1/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /runtime/poll_three_arm_results.py
            /runtime/test_poll_three_arm_results.py
            /workspace-updates/20261118-three-arm/
            /workspace-updates/20261115-remaining-nations-brazil/remaining-evidence.tar.gz
            /future/bundle-v2/objects/923e34fc44cda33fe965498a24a2435abb37a01a80c539108d8ec20d490bf013
            /market/runs/44223152835-1-bra1/
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 3fd411a4a34769e3192816631f2fa90948ad4ac9
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay original sources, active model and all three arms
        run: |
          python -m pip install -r source/requirements.txt
          python data/workspace-updates/20261118-three-arm/verify.py --source source
      - name: Test registration and bounded post-match collection
        env:
          PYTHONPATH: ${{ github.workspace }}/source/runtime
        run: python -m unittest discover -s data/runtime -p test_poll_three_arm_results.py -v
