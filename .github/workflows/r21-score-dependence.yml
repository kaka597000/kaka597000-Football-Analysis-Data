name: Rebuild R21 score-dependence evidence
on:
  pull_request:
    paths:
      - 'workspace-updates/20261125-r21-score-dependence/**'
      - '.github/workflows/r21-score-dependence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      R21: workspace-updates/20261125-r21-score-dependence
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pin
        name: Read the complete locked R21 source revision
        shell: python
        run: |
          import json, os, pathlib, re
          lock = json.loads((pathlib.Path(os.environ['R21']) / 'source-lock.json').read_bytes())
          revision = lock['source_commit']
          if not isinstance(revision, str) or not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise ValueError('R21 requires a full 40-character source commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'revision={revision}', file=output)
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: ${{ steps.pin.outputs.revision }}
          path: source
          persist-credentials: false
      - name: Install locked Python and model dependencies
        run: python -m pip install -r source/requirements.txt lightgbm==4.6.0
      - name: Run R21 runtime regression suite
        env:
          PYTHONPATH: source/runtime
        run: >-
          python -B -m unittest
          research_program.test_score_dependence
          research_program.test_score_dependence_forward
          research_program.test_score_dependence_study
          research_program.test_territory_forward
      - name: Rebuild Understat, retrain all leagues twice, and verify frozen seats
        env:
          PYTHONPATH: source/runtime
        run: >-
          python -B "$R21/verify.py"
          --source source
          --data-root .
