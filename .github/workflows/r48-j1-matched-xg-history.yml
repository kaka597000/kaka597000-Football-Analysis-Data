name: Reproduce J1 matched xG and goals study

on:
  pull_request:
    paths:
      - 'workspace-updates/20261127-r48-j1-matched-xg-history/**'
      - '.github/workflows/r48-j1-matched-xg-history.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261127-r48-j1-matched-xg-history
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi/models
            workspace-updates/20261123-prematch-literature/models
            workspace-updates/20261127-r48-j1-matched-xg-history
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 3a4945e4a6c131cc1f95c2f9bb2e5e84fcf2fa9a
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Verify the frozen input checksums and reproduce both date windows
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261127-r48-j1-matched-xg-history/protocol.json
          python -B -m research_program.j1_matched_xg_history --data . --out "$RUNNER_TEMP/r48-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r48-replay"
