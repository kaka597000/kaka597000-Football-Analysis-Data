name: Verify configured football API secrets
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wcpp-private-research-state
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: data
          sparse-checkout: |
            .github
            runtime
            future/nations-repair-bundle
            api-probes
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 4c6061dd5eb2e4af77f18e64bd908a2847f039d0
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/requirements.txt
      - name: Verify probe guards before using credentials
        working-directory: data
        env:
          WCPP_PROBE_TEST_CODE: ${{ github.workspace }}/code
        run: python -m unittest discover -s runtime -p 'test_*.py' -v
      - name: Verify seven explicit bindings with bounded real requests
        working-directory: data
        env:
          WCPP_BSD_API_KEY: ${{ secrets.BSD }}
          WCPP_FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALLDATA }}
          WCPP_INFERSPORTS_KEY: ${{ secrets.INFER }}
          WCPP_OPENFOOT_API_KEY: ${{ secrets.OPENFOOT }}
          WCPP_ODDS_API_KEY: ${{ secrets.THEODDSAPI }}
          WCPP_5DOLLAR_API_KEY: ${{ secrets.WCPP_5DOLLAR_API_KEY }}
          WCPP_API_FOOTBALL_KEY: ${{ secrets.WCPP_API_FOOTBALL_KEY }}
          PROBE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python runtime/probe_configured_apis.py --code ../code --state . --out "api-probes/$PROBE_RUN_ID"
      - name: Persist safe provider results and raw market evidence
        if: always()
        working-directory: data
        run: |
          git config user.name 'WCPP automation'
          git config user.email 'wcpp-automation@users.noreply.github.com'
          git add api-probes
          if ! git diff --cached --quiet; then
            git commit -m 'Verify configured football API credentials and data access'
            git push origin HEAD:main
          fi
