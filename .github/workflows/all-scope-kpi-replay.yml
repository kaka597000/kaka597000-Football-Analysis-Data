name: Replay twenty independent football score policies
on:
  workflow_dispatch:
  push:
    paths:
      - 'workspace-updates/20261123-all-scope-kpi/**'
      - '.github/workflows/all-scope-kpi-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 961dbdd47ccee5cfad128d2d972c3f0dd9b70696
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/requirements.txt lightgbm==4.6.0
      - run: python data/workspace-updates/20261123-all-scope-kpi/verify_archive.py --archive data/workspace-updates/20261123-all-scope-kpi --code code
