name: Replay R7 November 26 forward settlement

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r7-forward-settlement/**'
      - '.github/workflows/r7-nov26-forward-settlement.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-r7-forward-settlement
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-r9-team-score
            workspace-updates/20261125-forward-settlement
            workspace-updates/20261126-r7-forward-settlement
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 71ba85c405c825d3fff10894de6b7dcf2eb3e5e3
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Replay all original fixtures from retained evidence
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          python -B "$PACKAGE/settle.py" > "$RUNNER_TEMP/r7-nov26-review.json"
          cmp "$PACKAGE/settlement.json" "$RUNNER_TEMP/r7-nov26-review.json"
