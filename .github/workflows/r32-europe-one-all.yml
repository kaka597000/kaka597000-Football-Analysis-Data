name: Reproduce the R32 European exact-score replay

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r32-europe-one-all/**'
      - '.github/workflows/r32-europe-one-all.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-r32-europe-one-all
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-r13-domestic-form
            workspace-updates/20261126-r32-europe-one-all
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 57c62db0681c8bdaae668c501f98a3b452781f15
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Replay the fixed cohorts and compare the score-path diagnosis
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261126-r32-europe-one-all/protocol.json
          python -B -m research_program.europe_one_all_calibration --data . --out "$RUNNER_TEMP/r32-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r32-replay"
