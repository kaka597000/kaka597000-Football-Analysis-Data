name: Rebuild five-league R23 penalty-opportunity evidence

on:
  pull_request:
    paths:
      - 'workspace-updates/20261125-r23-penalty-opportunity/**'
      - '.github/workflows/r23-penalty-opportunity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r23-retrain-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R23_PACKAGE: workspace-updates/20261125-r23-penalty-opportunity
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: pin
        name: Read the pinned source revision and Python version
        shell: python
        run: |
          import json, os, pathlib, re

          package = pathlib.Path(os.environ['R23_PACKAGE'])
          lock = json.loads((package / 'source-lock.json').read_bytes())
          revision = lock['source_commit']
          python = lock['runtime']['python']
          if not isinstance(revision, str) or not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise ValueError('R23 requires a full 40-character source commit')
          if not isinstance(python, str) or not re.fullmatch(r'3\.12\.\d+', python):
              raise ValueError('R23 requires a pinned Python 3.12 patch version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'revision={revision}', file=output)
              print(f'python={python}', file=output)
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pin.outputs.python }}
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: ${{ steps.pin.outputs.revision }}
          path: source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Install the pinned numerical dependencies
        run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Refit twice and verify archived research firsts and ranked seats
        run: python -B "$R23_PACKAGE/verify.py" --source source --data-root .
