name: Reproduce R44 J1 rolling score calibration

on:
  pull_request:
    paths:
      - 'workspace-updates/20261127-r44-j1-rolling-score-calibration/**'
      - '.github/workflows/r44-j1-rolling-score-calibration.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261127-r44-j1-rolling-score-calibration
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261127-r41-j1-local-score-calibration
            workspace-updates/20261127-r42-j1-fixed-first-backups
            workspace-updates/20261127-r44-j1-rolling-score-calibration
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 449e1550414353dd5643d7a7abc27e56d53afc1d
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Replay regular J1 dates with frozen controls and causal weights
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261127-r44-j1-rolling-score-calibration/protocol.json
          python -B -m research_program.j1_rolling_score_calibration --data . --replay "$RUNNER_TEMP/r44-replay"
          diff -qr "$PACKAGE/replay" "$RUNNER_TEMP/r44-replay"
          python -B -m unittest research_program.test_j1_rolling_score_calibration
