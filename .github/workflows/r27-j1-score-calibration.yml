name: Replay R27 J1 exact-score calibration

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r27-j1-score-calibration/**'
      - '.github/workflows/r27-j1-score-calibration.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED: workspace-updates/20261126-r27-j1-score-calibration
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261126-r27-j1-score-calibration
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 78e352c39ad21caea35c5ea2e4bfa4d6c190af2e
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Refit and compare the paired historical results
        shell: bash
        run: |
          (cd "$EXPECTED" && sha256sum -c SHA256SUMS)
          cmp "$EXPECTED/protocol.json" source/research/20261126-r27-j1-score-calibration/protocol.json
          replay="$RUNNER_TEMP/r27-j1-replay"
          python -B -m research_program.j1_score_calibration --data . --out "$replay"
          for file in fit.json metrics.json; do
            cmp "$EXPECTED/replay/$file" "$replay/$file"
          done
          for file in forecasts.jsonl.gz validation.jsonl.gz; do
            cmp <(gzip -dc "$EXPECTED/replay/$file") <(gzip -dc "$replay/$file")
          done
