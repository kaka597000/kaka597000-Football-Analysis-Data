name: Verify R28 original J1 research issues

on:
  pull_request:
    paths:
      - 'workspace-updates/20261126-r28-j1-process-forward/**'
      - '.github/workflows/r28-j1-process-forward.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261126-r28-j1-process-forward
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261125-j1-stage-windows
            workspace-updates/20261125-forward-settlement
            workspace-updates/20261126-r26-j1-first-stage
            workspace-updates/20261126-j1-recent-process
            workspace-updates/20261126-r28-j1-process-forward
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: bc0ec1c11a33b073ccbd827266f686bc98c1f821
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Verify the actual prematch receipts and replay the choices
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          cmp "$PACKAGE/protocol.json" source/research/20261126-r28-j1-process-forward/protocol.json
          python -B -m research_program.j1_process_forward --data . --verify "$PACKAGE/issued" > "$RUNNER_TEMP/r28-status.json"
          cmp "$PACKAGE/status-at-issue.json" "$RUNNER_TEMP/r28-status.json"
          python -B -m research_program.j1_process_forward --data . > "$RUNNER_TEMP/r28-replay.json"
          cmp "$PACKAGE/replay.json" "$RUNNER_TEMP/r28-replay.json"
