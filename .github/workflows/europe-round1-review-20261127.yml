name: Verify the original European first-round settlement

on:
  pull_request:
    paths:
      - 'workspace-updates/20261127-europe-round1-review/**'
      - '.github/workflows/europe-round1-review-20261127.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: workspace-updates/20261127-europe-round1-review
      PYTHONPATH: source/runtime
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      NPY_DISABLE_CPU_FEATURES: AVX512F
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            workspace-updates/20261123-all-scope-kpi
            workspace-updates/20261123-prematch-literature
            workspace-updates/20261125-forward-settlement/nov25
            workspace-updates/20261125-j1-stage-windows/registration
            workspace-updates/20261125-r10-shot-conversion
            workspace-updates/20261125-r13-domestic-form
            workspace-updates/20261126-europe-first-display
            workspace-updates/20261126-j1-december-windows
            workspace-updates/20261126-j1-forward-result-review/nov25-state
            workspace-updates/20261126-r26-j1-first-stage/nov28_29
            workspace-updates/20261126-r26-j1-first-stage/public-archive
            workspace-updates/20261126-r34-europe-winning-margin/issued
            workspace-updates/20261126-r38-europe-domestic-opponents/issued
            workspace-updates/20261127-europe-round1-review
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: 2d7754822cc36e0387c61a140a4309be7d6e8ead
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r source/requirements.txt lightgbm==4.6.0 pandas==3.1.0
      - name: Reconcile raw scores and clocks against the original displays
        run: |
          (cd "$PACKAGE" && sha256sum -c SHA256SUMS)
          python -B "$PACKAGE/build.py" --out "$RUNNER_TEMP/europe-settlement" --verify-seal
          diff -qr "$PACKAGE/settlement" "$RUNNER_TEMP/europe-settlement"
      - name: Replay the J.League clock evidence and three registered J1 slates
        run: |
          python -B "$PACKAGE/j1_capture_plan.py" > "$RUNNER_TEMP/j1-capture-plan.json"
          cmp "$PACKAGE/j1-capture-plan.json" "$RUNNER_TEMP/j1-capture-plan.json"
